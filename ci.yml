name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with bash
        run: bash -n macaudit.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -s bash -e SC2181
        with:
          severity: warning

  run:
    # macos-13 is Intel, macos-14 and macos-15 are Apple Silicon.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Version matches the script
        run: ./macaudit.sh --version

      - name: First run establishes the baseline
        run: |
          ./macaudit.sh --fast --diff --no-open -o first.html
          grep -q "System report" first.html
          grep -q "Baseline saved" first.html

      - name: Second run reports changes
        run: |
          mkdir -p ~/Applications/CIProbe.app/Contents
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 9.9.9" \
            ~/Applications/CIProbe.app/Contents/Info.plist
          ./macaudit.sh --fast --diff --no-open -o second.html
          grep -q ">Changes<" second.html
          grep -q "CIProbe" second.html

      - name: Redaction leaks nothing
        run: |
          ./macaudit.sh --fast --redact --no-snapshot --no-open -o redacted.html
          for leak in "/Users/runner" "$(id -un)" "$(scutil --get ComputerName)"; do
            if grep -qF "$leak" redacted.html; then
              echo "::error::redacted report still contains: $leak"; exit 1
            fi
          done
          grep -q "Redacted:" redacted.html

      - name: Report is self-contained
        run: |
          if grep -Eq '<(script|img|link)[^>]+(src|href)="https?:' redacted.html; then
            echo "::error::report references an external resource"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: redacted.html
